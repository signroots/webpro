                data:
                  type: object
                  description: Created order details
                  properties:

                    _id:
                      type: string
                      example: "6a6857452d51261a3cb73d24"

                    domainName:
                      type: string
                      example: "khTest.in"

                    managedBy:
                      type: string
                      enum:
                        - Signroots
                        - Customer
                      example: "Signroots"

                    client:
                      type: string
                      example: "6a59e227c76bf36534a02d2b"

                    email_flag:
