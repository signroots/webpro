                      example: true

                    microsoft_email:
                      type: boolean
                      example: false

                    registrationDate:
                      type: string
                      format: date-time
                      example: "2026-07-28T00:00:00.000Z"

                    expiryDate:
                      type: string
                      format: date-time
                      example: "2027-07-28T00:00:00.000Z"



