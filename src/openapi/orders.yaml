                  example: false

                error:
                  type: object
                  properties:

                    code:
                      type: string
                      example: "VALIDATION_ERROR"

                    message:
                      type: string
                      example: "PlanId, EmailTypeId or type is missing"


        "500":

          description: Internal server error
          content:
          application/json:
            schema:
              type: object
              properties:

                success:
                  type: boolean
                  example: false

                error:
                  type: object
                  properties:

                    code:
                      type: string
                      example: "INTERNAL_SERVER_ERROR"

                    message:
                      type: string  
                      example: "Something went wrong"

