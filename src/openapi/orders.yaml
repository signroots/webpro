paths:
  /order:
    get:
      tags:
        - Order
      summary: Get all orders with search, pagination, and status updates
      description: Fetches orders list based on user role (Admin/Customer).
      parameters:
        - name: search
          in: query
          required: false
          description: Search term to filter by domainName or managedBy
          schema:
            type: string
            example: "test.com"
        - name: page
          in: query
          required: false
          description: Page number for pagination
          schema:
            type: integer
            default: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            default: 50
            example: 10
      responses:
        "200":
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  client:
                    type: object
                    description: Present if logged-in user is a Customer
                    properties:
                      _id:
                        type: string
                        example: "696deffdd47075559f1fd475"
                      c_name:
                        type: string
                        example: "JIH"
                      c_email:
                        type: array
                        items:
                          type: string
                        example: ["AAPKAPATH@GMAIL.COM"]
                      c_company:
                        type: string
                        example: "Signroots"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: "6933b87d7439b558ce42561c"
                        domainName:
                          type: string
                          example: "aapkapath.com"
                        managedBy:
                          type: string
                          example: "Signroots"
                        domainSource:
                          type: string
                          example: "Cloudflare"
                        status:
                          type: string
                          enum: [ACTIVE, EXPIRED]
                          example: "ACTIVE"
                        expiryDate:
                          type: string
                          format: date-time
                          example: "2027-02-07T19:24:59.000Z"
                        registrationDate:
                          type: string
                          format: date-time
                          example: "2025-02-07T19:24:58.779Z"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 50
                      total:
                        type: integer
                        example: 100
                      totalPages:
                        type: integer
                        example: 2
        "401":
          description: Unauthorized
        "403":
          description: Access denied
        "500":
          description: Server error

    post:
      tags:
        - Order

      summary: Create new order with email plans

      requestBody:
        required: true

        content:
          application/json:

            schema:
              type: object

              required:
                - domainName
                - managedBy


              properties:

                is_customer:
                  type: boolean
                  example: true


                client:
                  type: string
                  example: "6a59e227c76bf36534a02d2b"


                newCustomer:
                  type: object

                  properties:

                    c_name:
                      type: string
                      example: "John Doe"

                    c_company:
                      type: string
                      example: "ABC Company"

                    c_address:
                      type: string
                      example: "Kochi"

                    c_city:
                      type: string
                      example: "Kochi"

                    c_gst:
                      type: string
                      example: "32AAAAA0000A1Z5"

                    c_zipCode:
                      type: string
                      example: "682001"

                    c_phone:
                      type: string
                      example: "9876543210"

                    c_email:
                      type: string
                      example: "john@gmail.com"



                domainName:
                  type: string
                  example: "khTest.in"



                managedBy:
                  type: string
                  enum:
                    - Signroots
                    - Customer
                  example: Signroots



                domainSource:
                  type: string
                  enum:
                    - Reseller Club
                    - Hostinger
                    - Squarespace
                    - Sahara
                    - Cloudflare
                    - AE Server
                  example: Cloudflare



                # domainSource:
                #   type: string
                #   example: ""



                registrationDate:
                  type: string
                  format: date
                  example: "2026-07-28"



                expiryDate:
                  type: string
                  format: date
                  example: "2027-07-28"



                # users:
                #   type: integer
                #   example: 1



                email_flag:
                  type: boolean
                  example: true



                google_email:
                  type: boolean
                  example: true



                microsoft_email:
                  type: boolean
                  example: false



                # hosting:
                #   type: boolean
                #   example: false



                # host_flag:
                #   type: boolean
                #   example: false



                # website_flag:
                #   type: boolean
                #   example: false



                domain_flag:
                  type: boolean
                  example: true



                # ssl_flag:
                #   type: boolean
                #   example: false



                # cloudflareRegistered:
                #   type: boolean
                #   example: false



                # emailType:
                #   type: string
                #   example: "Google Workspace"



                # email_registrationDate:
                #   type: string
                #   format: date
                #   example: "2026-07-28"



                # email_expiryDate:
                #   type: string
                #   format: date
                #   example: "2027-07-28"



                plans:

                  type: array


                  items:

                    type: object


                    required:

                      - planId
                      - emailTypeId
                      - type


                    properties:

                      emailTypeId:
                        type: string
                        example: "6a54bef61e9ab96fe142b5bf"
                      emailType:
                        type: string
                        example: "Google Workspace"
                      planId:
                        type: string
                        example: "6a54befb1e9ab96fe142b5c5"

                      planName:
                        type: string
                        example: "Business Starter"
                      type:
                        type: string

                        enum:
                          - email
                          - storage
                          - msoffice

                        example: storage



                      noOfUsers:
                        type: integer
                        example: 1



                      registrationDate:
                        type: string
                        format: date
                        example: "2026-07-28"



                      expiryDate:
                        type: string
                        format: date
                        example: "2026-07-31"



                      # storage_services_flag:
                      #   type: boolean
                      #   example: true



                      # msoffice_services_flag:
                      #   type: boolean
                      #   example: false



                      # google_email:
                      #   type: boolean
                      #   example: true



                      # microsoft_email:
                      #   type: boolean
                      #   example: false



      responses:

        "201":

          description: Order created successfully


        "400":

          description: Validation error


        "500":

          description: Internal server error

  /order/{id}:
    put:
      tags:
        - Order
      summary: Update an existing Order by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Order Mongo ID
          schema:
            type: string
            example: "6a59e227c76bf36534a02d2c"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_customer:
                  type: boolean
                  example: true
                client:
                  type: string
                  example: "6a59e227c76bf36534a02d2b"
                domainName:
                  type: string
                  example: "test.com"
                managedBy:
                  type: string
                  example: "Signroots"
                hoststorageId:
                  type: string
                  example: "6a54befb1e9ab96fe142b5c7"
                plans:
                  type: array
                  items:
                    type: object
                    properties:
                      planId:
                        type: string
                        example: "6a54befb1e9ab96fe142b5c5"
                      planName:
                        type: string
                        example: "Business Starter"
                      emailTypeId:
                        type: string
                        example: "6a54bef61e9ab96fe142b5bf"
                      emailType:
                        type: string
                        example: "Workspace"
                      type:
                        type: string
                        example: "Google Workspace"
                      noOfUsers:
                        type: integer
                        example: 2
                      registrationDate:
                        type: string
                        format: date
                        example: "2026-07-25"
                      expiryDate:
                        type: string
                        format: date
                        example: "2027-07-25"
      responses:
        "200":
          description: Order updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
        "400":
          description: Invalid client ID or missing data
        "404":
          description: Order not found
        "500":
          description: Internal server error