paths:

  /typeemail:

    post:

      tags:
        - Type Email

      summary: Create Type Email

      description: Create a new Type Email with name and image

      requestBody:

        required: true

        content:

          multipart/form-data:

            schema:

              type: object

              required:
                - name
                - image

              properties:

                name:
                  type: string
                  example: Welcome Email

                image:
                  type: string
                  format: binary

      responses:

        "201":
          description: Type Email created successfully

          content:
            application/json:

              schema:

                type: object

                properties:

                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: Type Email created successfully

                  data:
                    type: object
                    properties:

                      _id:
                        type: string
                        example: 687fd15f4c25dd8d0b6e1234

                      name:
                        type: string
                        example: Welcome Email

                      image:
                        type: string
                        example: /uploads/typeemails/email.png

        "400":
          description: Name or image is missing

          content:
            application/json:

              schema:

                type: object

                properties:

                  success:
                    type: boolean
                    example: false

                  message:
                    type: string
                    example: Name is required

        "500":
          description: Server error


    get:

      tags:
        - Type Email

      summary: Get all Type Emails

      description: Returns all Type Email records sorted by creation date

      responses:

        "200":
          description: Type Email list fetched successfully

          content:
            application/json:

              schema:

                type: object

                properties:

                  success:
                    type: boolean
                    example: true

                  data:
                    type: array

                    items:

                      type: object

                      properties:

                        _id:
                          type: string
                          example: 687fd15f4c25dd8d0b6e1234

                        name:
                          type: string
                          example: Welcome Email

                        image:
                          type: string
                          example: /uploads/typeemails/email.png

                        isActive:
                          type: boolean
                          example: true

        "500":
          description: Server error



  /typeemail/{id}:

    get:

      tags:
        - Type Email

      summary: Get Type Email by ID

      description: Returns a Type Email record by its ID

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: string

          example: 687fd15f4c25dd8d0b6e1234

      responses:

        "200":
          description: Type Email fetched successfully

          content:
            application/json:

              schema:

                type: object

                properties:

                  success:
                    type: boolean
                    example: true

                  data:
                    type: object

                    properties:

                      _id:
                        type: string
                        example: 687fd15f4c25dd8d0b6e1234

                      name:
                        type: string
                        example: Welcome Email

                      image:
                        type: string
                        example: /uploads/typeemails/email.png

                      isActive:
                        type: boolean
                        example: true

        "404":
          description: Type Email not found

          content:
            application/json:

              schema:

                type: object

                properties:

                  success:
                    type: boolean
                    example: false

                  message:
                    type: string
                    example: TypeEmail not found

        "500":
          description: Server error



  /typeemail/{id}/toggle:

    put:

      tags:
        - Type Email

      summary: Toggle Type Email status

      description: |
        Toggle the isActive status of a Type Email.
        The name can also be updated and a new image can be uploaded.

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: string

          example: 687fd15f4c25dd8d0b6e1234

      requestBody:

        required: false

        content:

          multipart/form-data:

            schema:

              type: object

              properties:

                name:
                  type: string
                  example: Updated Welcome Email

                image:
                  type: string
                  format: binary

      responses:

        "200":
          description: Type Email updated successfully

          content:
            application/json:

              schema:

                type: object

                properties:

                  success:
                    type: boolean
                    example: true

                  data:
                    type: object

                    properties:

                      _id:
                        type: string
                        example: 687fd15f4c25dd8d0b6e1234

                      name:
                        type: string
                        example: Updated Welcome Email

                      image:
                        type: string
                        example: /uploads/typeemails/new-email.png

                      isActive:
                        type: boolean
                        example: false

        "404":
          description: Type Email not found

          content:
            application/json:

              schema:

                type: object

                properties:

                  success:
                    type: boolean
                    example: false

                  message:
                    type: string
                    example: TypeEmail not found

        "500":
          description: Server error


    delete:

      tags:
        - Type Email

      summary: Delete Type Email

      description: Delete a Type Email by its ID

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: string

          example: 687fd15f4c25dd8d0b6e1234

      responses:

        "200":
          description: Type Email deleted successfully

          content:
            application/json:

              schema:

                type: object

                properties:

                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: TypeEmail deleted successfully

        "404":
          description: Type Email not found

          content:
            application/json:

              schema:

                type: object

                properties:

                  success:
                    type: boolean
                    example: false

                  message:
                    type: string
                    example: TypeEmail not found

        "500":
          description: Server error