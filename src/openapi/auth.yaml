  /users/refresh:


    post:

      tags:

        - Authentication


      summary: Refresh access token


      requestBody:

        required: true


        content:

          application/json:

            schema:

              type: object

              properties:


                refreshToken:

                  type: string



      responses:


        "200":

          description: New access token generated