# ================= CLIENT =================


  /api/client:


    get:

      summary: Get all clients

      tags:

        - Clients


      responses:

        "200":

          description: Client list


          content:

            application/json:

              schema:

                type: array

                items:

                  type: object


                  properties:


                    _id:

                      type: string

                      example: "6a59e227c76bf36534a02d2b"



                    c_name:

                      type: string

                      example: "Hari"



                    c_email:

                      type: array

                      items:

                        type: string

                      example:

                        - "hari@gmail.com"



                    c_phone:

                      type: string

                      example: "9539263176"



                    c_mobilePhone:

                      type: string

                      example: "9539263176"



                    c_company:

                      type: string

                      example: "signroots"



                    c_address:

                      type: string

                      example: "kottayil"



                    c_city:

                      type: string

                      example: "ckm"



                    c_zipCode:

                      type: string

                      example: "679575"



                    c_gst:

                      type: string

                      example: ""



                    is_active:

                      type: boolean

                      example: true



    post:


      summary: Create new client


      tags:

        - Clients


      requestBody:

        required: true


        content:

          application/json:


            schema:


              type: object


              properties:


                c_name:

                  type: string

                  example: "Hari"



                c_email:

                  type: array

                  items:

                    type: string

                  example:

                    - "hari@gmail.com"



                c_phone:

                  type: string

                  example: "9539263176"



                c_mobilePhone:

                  type: string

                  example: "9539263176"



                c_company:

                  type: string

                  example: "signroots"



                c_address:

                  type: string

                  example: "kottayil"



                c_city:

                  type: string

                  example: "ckm"



                c_state:

                  type: string

                  example: "6a33c0c22763c3cf0235ddd2"



                c_country:

                  type: string

                  example: "6a3271527a0a465389890837"



                c_zipCode:

                  type: string

                  example: "679575"



                c_gst:

                  type: string

                  example: ""


      responses:

        "201":

          description: Client created successfully


        "400":

          description: Bad request


        "500":

          description: Server error